<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="925" viewBox="0 0 1100 925" role="img"><title>经典 Transformer 编码器解码器</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#426b86"/></marker></defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#213e4b;text-anchor:middle}.title{font-size:23px;font-weight:600}.label{font-size:16px;font-weight:600}.small{font-size:12px;fill:#5a737b}.tiny{font-size:10px;fill:#5b8075}.arrow{fill:none;stroke:#426b86;stroke-width:2;marker-end:url(#a)}.skip{fill:none;stroke:#579983;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#a)}</style><rect width="1100" height="925" fill="white"/><text x="550" y="38" class="title">Classic Transformer · Encoder–Decoder / Post-LN</text><text x="550" y="63" class="small">教学重绘 · 数据由上向下 · 不同序列长度 n 与 m · 图中省略 dropout</text><rect x="91" y="260" width="357" height="492" rx="15" fill="#f4f8fb" stroke="#aac1cc"/><rect x="601" y="260" width="358" height="492" rx="15" fill="#f3f6f0" stroke="#afc4ad"/><text x="270" y="285" class="label">Encoder layer × N</text><text x="780" y="285" class="label">Decoder layer × N</text><g><rect x="120" y="94" width="300" height="52" rx="7" fill="#edf3ef" stroke="#8da9ae"/><text x="270" y="116" class="label">输入序列 x₁ … xₙ</text><text x="270" y="134" class="small">source tokens</text></g><g><rect x="630" y="94" width="300" height="52" rx="7" fill="#edf3ef" stroke="#8da9ae"/><text x="780" y="116" class="label">右移目标：BOS, y₁ … yₘ₋₁</text><text x="780" y="134" class="small">训练：teacher forcing / 推理：已生成前缀</text></g><g><rect x="120" y="181" width="300" height="52" rx="7" fill="#edf3ef" stroke="#8da9ae"/><text x="270" y="203" class="label">输入嵌入 + 位置编码</text><text x="270" y="221" class="small">X ∈ Rⁿˣᵈ</text></g><g><rect x="630" y="181" width="300" height="52" rx="7" fill="#edf3ef" stroke="#8da9ae"/><text x="780" y="203" class="label">目标嵌入 + 位置编码</text><text x="780" y="221" class="small">Y ∈ Rᵐˣᵈ</text></g><path d="M270 146 L270 181" class="arrow" /><path d="M270 233 L270 312" class="arrow" /><path d="M780 146 L780 181" class="arrow" /><path d="M780 233 L780 312" class="arrow" /><g><rect x="120" y="312" width="300" height="52" rx="7" fill="#e4eff7" stroke="#8da9ae"/><text x="270" y="334" class="label">Multi-Head Self-Attention</text><text x="270" y="352" class="small">Q, K, V 都来自编码器输入</text></g><g><rect x="120" y="391" width="300" height="52" rx="7" fill="#edf3ef" stroke="#8da9ae"/><text x="270" y="413" class="label">Add &amp; LayerNorm</text><text x="270" y="431" class="small">LN(X + Attention(X))</text></g><g><rect x="120" y="486" width="300" height="52" rx="7" fill="#f7eedf" stroke="#8da9ae"/><text x="270" y="508" class="label">Position-wise FFN</text><text x="270" y="526" class="small">ReLU / 两个线性层</text></g><g><rect x="120" y="565" width="300" height="52" rx="7" fill="#edf3ef" stroke="#8da9ae"/><text x="270" y="587" class="label">Add &amp; LayerNorm</text><text x="270" y="605" class="small">LN(U + FFN(U))</text></g><g><rect x="630" y="312" width="300" height="52" rx="7" fill="#e4eff7" stroke="#8da9ae"/><text x="780" y="334" class="label">Masked Multi-Head Self-Attention</text><text x="780" y="352" class="small">因果 mask 禁止看未来目标</text></g><g><rect x="630" y="391" width="300" height="52" rx="7" fill="#edf3ef" stroke="#8da9ae"/><text x="780" y="413" class="label">Add &amp; LayerNorm</text><text x="780" y="431" class="small">第一条残差</text></g><g><rect x="630" y="470" width="300" height="52" rx="7" fill="#e1f0e9" stroke="#8da9ae"/><text x="780" y="492" class="label">Multi-Head Cross-Attention</text><text x="780" y="510" class="small">Q ← 解码器；K,V ← 编码器输出</text></g><g><rect x="630" y="549" width="300" height="52" rx="7" fill="#edf3ef" stroke="#8da9ae"/><text x="780" y="571" class="label">Add &amp; LayerNorm</text><text x="780" y="589" class="small">第二条残差</text></g><g><rect x="630" y="628" width="300" height="52" rx="7" fill="#f7eedf" stroke="#8da9ae"/><text x="780" y="650" class="label">Position-wise FFN</text><text x="780" y="668" class="small">逐 token 非线性变换</text></g><g><rect x="630" y="699" width="300" height="52" rx="7" fill="#edf3ef" stroke="#8da9ae"/><text x="780" y="721" class="label">Add &amp; LayerNorm</text><text x="780" y="739" class="small">第三条残差</text></g><path d="M270 364 L270 391" class="arrow" /><path d="M270 443 L270 486" class="arrow" /><path d="M270 538 L270 565" class="arrow" /><path d="M270 617 L270 684" class="arrow" /><g><rect x="120" y="684" width="300" height="52" rx="7" fill="#dce9f2" stroke="#8da9ae"/><text x="270" y="706" class="label">编码器最终输出 Z</text><text x="270" y="724" class="small">送至每个解码层作为 K,V</text></g><path d="M780 364 L780 391" class="arrow" /><path d="M780 443 L780 470" class="arrow" /><path d="M780 522 L780 549" class="arrow" /><path d="M780 601 L780 628" class="arrow" /><path d="M780 680 L780 699" class="arrow" /><path d="M270 300 H93 V417 H120" class="skip"/><text x="90" y="358.5" class="tiny" text-anchor="end">residual</text><path d="M270 466 H93 V591 H120" class="skip"/><text x="90" y="528.5" class="tiny" text-anchor="end">residual</text><path d="M780 300 H603 V417 H630" class="skip"/><text x="600" y="358.5" class="tiny" text-anchor="end">residual</text><path d="M780 449 H603 V575 H630" class="skip"/><text x="600" y="512" class="tiny" text-anchor="end">residual</text><path d="M780 615 H603 V725 H630" class="skip"/><text x="600" y="670" class="tiny" text-anchor="end">residual</text><path d="M420 710 H530 V496 H630" class="arrow"/><text x="532" y="477" class="small" text-anchor="middle">K,V</text><text x="796" y="461" class="tiny">Q</text><path d="M780 751 L780 800" class="arrow" /><g><rect x="630" y="800" width="300" height="52" rx="7" fill="#e6ece9" stroke="#8da9ae"/><text x="780" y="822" class="label">Linear → Softmax</text><text x="780" y="840" class="small">p(yᵢ | y&lt;ᵢ, source)</text></g><text x="270" y="809" class="small">每个子层输出宽度 d 相同，才能相加</text><text x="270" y="835" class="small">蓝实线：主流 / 绿虚线：残差支路</text><text x="550" y="892" class="small">Pre-LN 把归一化放在子层之前，顺序与本图不同 · 原论文 §3 / Figure 1</text></svg>